name: Continuous Fuzzing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Больше никакого Qt — только компилятор, cmake и ninja.
          sudo apt-get install -y cmake ninja-build clang

      - name: Configure CMake
        run: |
          cmake -B build-fuzz \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DTOYBROWSER_FUZZING=ON \
            -G Ninja

      - name: Build fuzzer
        run: cmake --build build-fuzz --target fuzz_html

      - name: Run Fuzzer
        run: |
          cd build-fuzz
          ./fuzz_html ../corpus/html/ -max_total_time=300 -artifact_prefix=./
        continue-on-error: true

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-crashes
          path: build-fuzz/crash-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload updated corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-corpus
          path: corpus/html/
          if-no-files-found: ignore
          retention-days: 7
