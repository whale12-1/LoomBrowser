name: Continuous Fuzzing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fuzz_html
            corpus: html
          - target: fuzz_css
            corpus: css
          - target: fuzz_selector
            corpus: selector
          - target: fuzz_style_tree
            corpus: style_tree
          - target: fuzz_layout
            corpus: layout
          - target: fuzz_display_list
            corpus: display_list

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Configure CMake
        working-directory: fuzz
        run: |
          cmake -B build-fuzz \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -G Ninja

      - name: Build ${{ matrix.target }}
        working-directory: fuzz
        run: cmake --build build-fuzz --target ${{ matrix.target }}

      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
          LSAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: |
          cd build-fuzz
          FUZZER=$(find . -name ${{ matrix.target }} -type f -executable | head -n1)
          [ -z "$FUZZER" ] && { echo "binary not found"; exit 1; }

          CORPUS="../corpus/${{ matrix.corpus }}"
          [ -d "$CORPUS" ] || { mkdir -p "$CORPUS"; }

          echo "Running $FUZZER on $CORPUS"
          "$FUZZER" "$CORPUS" \
            -max_total_time=180 \
            -artifact_prefix=./${{ matrix.target }}-
        continue-on-error: true

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-${{ matrix.target }}
          path: |
            fuzz/build-fuzz/${{ matrix.target }}-crash-*
            fuzz/build-fuzz/crash-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload updated corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.corpus }}/
          if-no-files-found: ignore
          retention-days: 7